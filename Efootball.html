<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#030511"
    >

    <title>CHAPCY • Live Chat</title>


    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- CHAPCY CHAT CSS -->
    <link
        rel="stylesheet"
        href="Efootball.css"
    >

</head>


<body>


<div class="chapcy-app">


    <!-- ================================
              LEFT NAVIGATION
    ================================= -->

    <aside
        class="side-nav"
        id="sideNav"
    >


        <!-- LOGO -->

        <div class="logo-area">

            <div class="logo-mark">
                C
            </div>

            <div class="logo-info">

                <strong>
                    CHAPCY
                </strong>

                <span>
                    Live Chat
                </span>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="main-nav">


            <button
                class="nav-link active"
                type="button"
            >

                <span>◈</span>

                <label>
                    Live Chat
                </label>

            </button>


            <button
                class="nav-link"
                type="button"
            >

                <span>✦</span>

                <label>
                    Vairo
                </label>

            </button>


            <button
                class="nav-link"
                type="button"
            >

                <span>▦</span>

                <label>
                    Rooms
                </label>

            </button>


            <button
                class="nav-link"
                type="button"
            >

                <span>♙</span>

                <label>
                    People
                </label>

            </button>


            <button
                class="nav-link"
                type="button"
            >

                <span>@</span>

                <label>
                    Mentions
                </label>

            </button>


            <button
                class="nav-link"
                type="button"
            >

                <span>✉</span>

                <label>
                    Messages
                </label>

            </button>


            <button
                class="nav-link"
                type="button"
            >

                <span>⚙</span>

                <label>
                    Settings
                </label>

            </button>


        </nav>


        <!-- CURRENT USER -->

        <div
            class="profile-mini"
            id="profileMini"
        >

            <div class="profile-avatar">

                <span id="profileLetter">
                    ?
                </span>

                <i></i>

            </div>


            <div class="profile-info">

                <strong id="profileName">
                    Loading...
                </strong>

                <span>
                    ● Online
                </span>

            </div>


            <button
                id="logoutBtn"
                type="button"
            >

                <i class="fas fa-right-from-bracket"></i>

            </button>

        </div>


    </aside>



    <!-- ================================
              MOBILE OVERLAY
    ================================= -->

    <div
        class="mobile-overlay"
        id="mobileOverlay"
    ></div>



    <!-- ================================
                  CHAT
    ================================= -->

    <main class="chat-container">


        <!-- HEADER -->

        <header class="chat-header">


            <div class="mobile-left">

                <button
                    class="menu-btn"
                    id="menuBtn"
                    type="button"
                >

                    <i class="fas fa-bars"></i>

                </button>


                <div class="mobile-logo">
                    C
                </div>

            </div>



            <div class="room-title">


                <div class="room-hash">
                    #
                </div>


                <div>

                    <h1>
                        🌍 General Chat
                    </h1>

                    <span>
                        Live conversation
                    </span>

                </div>


            </div>



            <div class="header-tools">


                <button
                    type="button"
                    id="chatSearchBtn"
                >

                    <i class="fas fa-magnifying-glass"></i>

                </button>


                <button
                    type="button"
                    id="chatMoreBtn"
                >

                    <i class="fas fa-ellipsis-vertical"></i>

                </button>


            </div>


        </header>



        <!-- SEARCH -->

        <div class="chat-search-wrap">

            <input
                type="search"
                id="chatSearch"
                placeholder="Search messages..."
                autocomplete="off"
            >

        </div>



        <!-- PINNED MESSAGE -->

        <section class="pinned-bar">


            <span class="pinned-icon">
                ✦
            </span>


            <div>

                <strong>
                    Pinned Message
                </strong>


                <p>
                    Welcome to CHAPCY Live Chat! 👋
                </p>

            </div>


        </section>



        <!-- ================================
              FIREBASE MESSAGES
        ================================= -->

        <section
            class="messages"
            id="messages"
        >

            <!-- Firebase messages will appear here -->

        </section>



        <!-- ================================
              TYPING INDICATOR
        ================================= -->

        <div
            class="typing"
            id="typingIndicator"
        >

            <span id="typingText"></span>

        </div>



        <!-- ================================
              MESSAGE COMPOSER
        ================================= -->

        <form
            class="composer"
            id="composer"
        >


            <button
                type="button"
                class="composer-add"
                id="attachBtn"
            >

                <i class="fas fa-plus"></i>

            </button>



            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                maxlength="2000"
                autocomplete="off"
            >


            <!-- JS CAN ALSO CREATE THIS AUTOMATICALLY -->

            <button
                type="button"
                class="emoji-btn"
                id="emojiBtn"
                aria-label="Emoji"
            >

                😊

            </button>


            <button
                type="submit"
                class="send-btn"
                id="sendBtn"
                aria-label="Send message"
            >

                <i class="fas fa-paper-plane"></i>

            </button>


        </form>


    </main>



    <!-- ================================
             ADVERTISEMENT AREA
    ================================= -->

    <aside class="ads-area">


        <div class="ads-title">

            <strong>
                Advertisements
            </strong>

            <span>
                ⓘ
            </span>

        </div>



        <div class="ad-slot">

            <div class="ad-plus">
                +
            </div>

        </div>



        <div class="ad-slot">

            <div class="ad-plus">
                +
            </div>

        </div>



        <div class="ad-slot">

            <div class="ad-plus">
                +
            </div>

        </div>


    </aside>


</div>



<!-- =====================================
          FIREBASE / CHAPCY CHAT JS
====================================== -->

<script
    type="module"
    src="./Efootball.js"
></script>


</body>

</html>
