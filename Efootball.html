<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#030511"
    >

    <title>CHAPCY • Live Chat</title>

    <link
        rel="stylesheet"
        href="Efootball.css"
    >

</head>


<body>


<!-- =====================================
             CHAPCY APP
====================================== -->

<div class="chapcy-app">


    <!-- =================================
             LEFT NAVIGATION
    ================================== -->

    <aside
        class="side-nav"
        id="sideNav">


        <!-- LOGO -->

        <div class="logo-area">

            <div class="logo-mark">
                C
            </div>

            <div class="logo-info">

                <strong>
                    CHAPCY
                </strong>

                <span>
                    Live Chat
                </span>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="main-nav">


            <button class="nav-link active">

                <span>◈</span>

                <label>
                    Live Chat
                </label>

            </button>


            <button class="nav-link">

                <span>✦</span>

                <label>
                    Vairo
                </label>

            </button>


            <button class="nav-link">

                <span>▦</span>

                <label>
                    Rooms
                </label>

            </button>


            <button class="nav-link">

                <span>♙</span>

                <label>
                    People
                </label>

            </button>


            <button class="nav-link">

                <span>@</span>

                <label>
                    Mentions
                </label>

            </button>


            <button class="nav-link">

                <span>✉</span>

                <label>
                    Messages
                </label>

            </button>


            <button class="nav-link">

                <span>⚙</span>

                <label>
                    Settings
                </label>

            </button>


        </nav>


        <!-- CURRENT USER -->

        <div
            class="profile-mini"
            id="profileMini">


            <div class="profile-avatar">

                <span id="profileLetter">
                    ?
                </span>

                <i></i>

            </div>


            <div class="profile-info">

                <strong id="profileName">
                    Loading...
                </strong>

                <span>
                    ● Online
                </span>

            </div>


            <button id="logoutBtn">
                ↪
            </button>


        </div>


    </aside>



    <!-- =================================
              MOBILE OVERLAY
    ================================== -->

    <div
        class="mobile-overlay"
        id="mobileOverlay">
    </div>



    <!-- =================================
                CHAT
    ================================== -->

    <main class="chat-container">


        <!-- HEADER -->

        <header class="chat-header">


            <div class="mobile-left">

                <button
                    class="menu-btn"
                    id="menuBtn"
                >
                    ☰
                </button>


                <div class="mobile-logo">
                    C
                </div>

            </div>


            <div class="room-title">


                <div class="room-hash">
                    #
                </div>


                <div>

                    <h1>
                        🌍 General Chat
                    </h1>

                    <span>
                        Live conversation
                    </span>

                </div>


            </div>


            <div class="header-tools">

                <button>
                    ⌕
                </button>

                <button>
                    ⋮
                </button>

            </div>


        </header>



        <!-- PINNED -->

        <section class="pinned-bar">

            <span class="pinned-icon">
                ✦
            </span>


            <div>

                <strong>
                    Pinned Message
                </strong>

                <p>
                    Welcome to CHAPCY Live Chat! 👋
                </p>

            </div>


        </section>



        <!-- =================================
                 REAL FIREBASE CHAT
        ================================== -->

        <section
            class="messages"
            id="messages"
        >

            <!--
                Firebase messages
                zitaingia hapa.
            -->

        </section>



        <!-- TYPING -->

        <div
            class="typing"
            id="typing"
        >
        </div>



        <!-- =================================
                MESSAGE COMPOSER
        ================================== -->

        <form
            class="composer"
            id="composer"
        >


            <button
                type="button"
                class="composer-add"
            >
                +
            </button>


            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                maxlength="2000"
                autocomplete="off"
            >


            <button
                type="button"
                class="emoji-btn"
            >
                ☺
            </button>


            <button
                type="submit"
                class="send-btn"
                id="sendBtn"
            >
                ➤
            </button>


        </form>


    </main>



    <!-- =================================
               ADVERTISEMENT AREA
    ================================== -->

    <aside class="ads-area">


        <div class="ads-title">

            <strong>
                Advertisements
            </strong>

            <span>
                ⓘ
            </span>

        </div>


        <!-- EMPTY AD 1 -->

        <div class="ad-slot">

            <!--
              WEKA TANGAZO LAKO HAPA BAADAYE
            -->

            <div class="ad-plus">
                +
            </div>

        </div>


        <!-- EMPTY AD 2 -->

        <div class="ad-slot">

            <div class="ad-plus">
                +
            </div>

        </div>


        <!-- EMPTY AD 3 -->

        <div class="ad-slot">

            <div class="ad-plus">
                +
            </div>

        </div>


    </aside>


</div>



<script
    type="module"
    src="Efootball.js"
></script>


</body>

</html>
