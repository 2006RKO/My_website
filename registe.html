<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050816">

<title>CHAPCY | Authentication</title>

<link rel="icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="register.css">

</head>

<body>

<!--============================
        BACKGROUND
=============================-->

<div class="background">

<img
src="file_000000005b1081f49cef6fcfbfb36468.png"
class="background-image"
alt="Background">

<div class="background-overlay"></div>

<div class="stars"></div>

<div class="particles"></div>

</div>

<!--============================
        AUTH WRAPPER
=============================-->

<div class="auth-wrapper">

<div class="auth-container" id="authContainer">

<!--============================
        LOGIN PANEL
=============================-->

<div class="form-panel login-panel">

<form id="loginForm" novalidate>

<img
src="logo.png"
class="form-logo"
alt="CHAPCY">

<h2>Welcome Back</h2>

<p>
Login to continue your CHAPCY journey.
</p>

<div class="input-box">

<input
type="email"
id="loginEmail"
placeholder="Email Address"
autocomplete="email"
required>

</div>

<div class="input-box">

<input
type="password"
id="loginPassword"
placeholder="Password"
autocomplete="current-password"
required>

<span class="toggle-password">👁</span>

</div>

<a href="#" class="forgot-link">

Forgot Password?

</a>

<button
type="submit"
class="primary-btn">

LOGIN

</button>

</form>

</div>

<!--============================
        REGISTER PANEL
=============================-->

<div class="form-panel register-panel">

<form id="registerForm" novalidate>

<img
src="logo.png"
class="form-logo"
alt="CHAPCY">

<h2>Create Account</h2>

<p>

Join millions of people on CHAPCY.

</p>

<div class="input-box">

<input
type="text"
id="fullName"
placeholder="Full Name"
autocomplete="name"
required>

</div>

<div class="input-box">

<input
type="email"
id="registerEmail"
placeholder="Email Address"
autocomplete="email"
required>

</div>

<div class="input-box">

<input
type="password"
id="registerPassword"
placeholder="Password"
autocomplete="new-password"
required>

<span class="toggle-password">👁</span>

</div>

<div class="input-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
autocomplete="new-password"
required>

<span class="toggle-password">👁</span>

</div>

<button
type="submit"
class="primary-btn">

CREATE ACCOUNT

</button>

</form>

</div>

<!--============================
      DIAGONAL SLIDER
=============================-->

<div class="slider-panel">

<div class="slider-content">

<img
src="logo.png"
class="slider-logo"
alt="CHAPCY">

<h1>CHAPCY</h1>

<p>

Connect • Chat • Share • Grow

</p>

<div class="slider-line"></div>

<h3 id="sliderTitle">

Welcome Back

</h3>

<p id="sliderText">

Don't have an account?

</p>

<button
type="button"
id="switchBtn"
class="switch-btn">

CREATE ACCOUNT

</button>

</div>

</div>

</div>

</div>

<!--============================
      JAVASCRIPT
=============================-->

<script type="module" src="register.js"></script>

</body>
</html>
