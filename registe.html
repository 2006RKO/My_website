<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#050816">

<title>CHAPCY | Authentication</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="register.css">

<link rel="icon" href="logo.png">

</head>

<body>

<!--============================
      BACKGROUND
=============================-->

<div class="background">

<img
src="file_000000005b1081f49cef6fcfbfb36468.png"
class="background-image"
alt="Background">

<div class="background-overlay"></div>

<div class="stars"></div>

<div class="particles"></div>

</div>

<!--============================
      AUTH CONTAINER
=============================-->

<div class="auth-wrapper">

<div class="auth-container" id="authContainer">

<!--============================
      LEFT FORM
=============================-->

<div class="form-panel login-panel">

<form id="loginForm" novalidate>

<img src="logo.png" class="form-logo">

<h2>Welcome Back</h2>

<p>Login to continue your CHAPCY journey.</p>

<div class="input-box">

<input
type="email"
id="loginEmail"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

<span class="toggle-password">👁</span>

</div>

<a href="#" class="forgot-link">

Forgot Password?

</a>

<button
type="submit"
class="primary-btn">

LOGIN

</button>

</form>

</div>

<!--============================
      RIGHT FORM
=============================-->

<div class="form-panel register-panel">

<form id="registerForm" novalidate>

<img src="logo.png" class="form-logo">

<h2>Create Account</h2>

<p>Join millions of people on CHAPCY.</p>

<div class="input-box">

<input
type="text"
id="fullName"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<input
type="email"
id="registerEmail"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="password"
id="registerPassword"
placeholder="Password"
required>

<span class="toggle-password">👁</span>

</div>

<div class="input-box">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required>

<span class="toggle-password">👁</span>

</div>

<button
type="submit"
class="primary-btn">

CREATE ACCOUNT

</button>

</form>

</div>

<!--============================
      DIAGONAL PANEL
=============================-->

<div class="slider-panel">

<div class="slider-content">

<img
src="logo.png"
class="slider-logo">

<h1>CHAPCY</h1>

<p>

Connect • Chat • Share • Grow

</p>

<div class="slider-line"></div>

<h3 id="sliderTitle">

New Here?

</h3>

<p id="sliderText">

Create your account and start chatting worldwide.

</p>

<button
id="switchBtn"
type="button"
class="switch-btn">

CREATE ACCOUNT

</button>

</div>

</div>

</div>

</div>

<!--============================
      FIREBASE
=============================-->

<script type="module" src="firebase-config.js"></script>

<script type="module" src="auth.js"></script>

</body>
      </html>
