<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CHAPCY V21</title>

<link rel="stylesheet" href="register.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<!--==========================
        BACKGROUND
===========================-->

<div class="background">

<img
src="file_000000005b1081f49cef6fcfbfb36468.png"
class="bg-image"
alt="Background">
<div class="bg-overlay"></div>

<div class="stars"></div>

<div class="particles"></div>

</div>

<!--==========================
      MAIN CONTAINER
===========================-->

<div class="container">

<!--==========================
        MAGIC BOOK
===========================-->

<div class="book">

<!--==========================
      FRONT COVER
===========================-->

<div
class="cover"
id="cover">

<!-- Glow -->

<div class="cover-glow"></div>

<!-- Logo -->

<div class="logo-box">

<img
src="file_0000000062f881f49632797ee8dec573.png"
class="logo"
alt="CHAPCY Logo">

</div>

<!-- Title -->

<h1>

CHAPCY

</h1>

<p class="tagline">

Connect • Chat • Share • Grow

</p>

<!--==========================
      ROCKET WELCOME
===========================-->

<div class="welcome-box">

    <div class="rocket">
        🚀
    </div>
        <div class="rocket-smoke"></div>

<div class="sparks">
    ✦ ✧ ✦ ✧ ✦
</div>

    <div class="explosion">
        ✨ 💥 ✨
    </div>

    <h2 class="welcome-title">
        Welcome Back
    </h2>

    <div class="pointer">
        👆
    </div>

</div>


<p class="description">

Choose how you want
to continue.

</p>
<!--==========================
        BUTTON AREA
===========================-->

<div class="button-area">

<button
id="registerBtn"
class="register-btn">

<span>

CREATE ACCOUNT

</span>

</button>

<button
id="loginBtn"
class="login-btn">

<span>

LOGIN NOW

</span>

</button>

</div>

<!-- Bottom -->

<div class="bottom-text">

✨ Experience the Future
of Communities

</div>

</div>

<!--==========================
     BOOK INNER PAGE
===========================-->

<div
class="inside-page"
id="insidePage">

<!--==========================
        BOOK SPINE
===========================-->

<div class="book-spine"></div>

<!--==========================
      REGISTER PANEL
===========================-->

<div
class="form-panel register-panel"
id="registerPanel">

<button
class="back-btn"
id="backRegister">

← Back

</button>

<h2>

Create Account

</h2>

<p>

Join the CHAPCY Community

</p>

<form
class="form"
id="registerForm">

<div class="input-box">

<input
type="text"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<input
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="password"
placeholder="Create Password"
required>

</div>

<div class="input-box">

<input
type="password"
placeholder="Confirm Password"
required>

</div>

<button
type="submit"
class="submit-btn">

CREATE ACCOUNT

</button>

</form>

<div class="switch-text">

Already have an account?

<a
href="#"
id="showLogin">

Login

</a>

</div>

</div>

<!--==========================
        LOGIN PANEL
===========================-->

<div
class="form-panel login-panel"
id="loginPanel">

<button
class="back-btn"
id="backLogin">

← Back

</button>

<h2>

Welcome Back

</h2>

<p>

Login to continue

</p>

<form
class="form"
id="loginForm">

<div class="input-box">

<input
type="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<input
type="password"
placeholder="Password"
required>

</div>

<button
type="submit"
class="submit-btn">

LOGIN NOW

</button>

</form>

<div class="switch-text">

Don't have an account?

<a
href="#"
id="showRegister">

Register

</a>

</div>

</div>

</div>

</div>

</div>

<script src="register.js"></script>

</body>

</html>
