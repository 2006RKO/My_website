<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAPCY V20</title>

<meta name="theme-color" content="#050816">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet" href="register.css">

<link rel="icon" href="logo.png">

</head>

<body>

<!--============================
      BACKGROUND
=============================-->

<div class="background">

<img
src="background.jpg"
class="background-image"
alt="Background">

<div class="background-overlay"></div>

<div class="stars"></div>

<div class="particles"></div>

</div>

<!--============================
      MAIN CONTAINER
=============================-->

<div class="main-container">

<!--============================
      WELCOME PAGE
=============================-->

<section
class="welcome-page"
id="welcomePage">

<img
src="logo.png"
class="chapcy-logo"
alt="CHAPCY">

<h1>CHAPCY</h1>

<p class="subtitle">

Connect • Chat • Share • Grow

</p>

<h2>

Welcome Back

</h2>

<p class="choose">

Choose how you want to continue

</p>

<div class="choice-container">

<!-- REGISTER -->

<div
class="choice-card register-card"
id="registerCard">

<div class="choice-icon">

<img
src="register-logo.png"
alt="Register">

</div>

<h3>REGISTER</h3>

<p>

Create your account
and get started.

</p>

<button>

CREATE ACCOUNT

</button>

</div>

<!-- LOGIN -->

<div
class="choice-card login-card"
id="loginCard">

<div class="choice-icon">

<img
src="login-logo.png"
alt="Login">

</div>

<h3>LOGIN</h3>

<p>

Login to your account
and continue.

</p>

<button>

LOGIN NOW

</button>

</div>

</div>

</section>

<!--============================
      REGISTER PAGE
=============================-->

<section
class="register-page"
id="registerPage">

<button
class="back-btn"
id="backRegister">

← Back

</button>

<div
class="page-content">

<!-- FORM ITAKUJA BAADAYE -->

</div>

</section>

<!--============================
      LOGIN PAGE
=============================-->

<section
class="login-page"
id="loginPage">

<button
class="back-btn"
id="backLogin">

← Back

</button>

<div
class="page-content">

<!-- FORM ITAKUJA BAADAYE -->

</div>

</section>

</div>

<script src="register.js"></script>

</body>

</html>
