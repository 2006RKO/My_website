<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CHAPCY V22 Ultra Live Chat</title>

<link rel="stylesheet" href="livechat.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<!--==========================
        BACKGROUND
===========================-->

<div class="bg-glow"></div>

<!--==========================
        MAIN APP
===========================-->

<div class="chat-app">

<!--==========================
        TOP HEADER
===========================-->

<header class="topbar">

<div class="logo-box">

<img src="logo.png" class="logo">

<div>

<h1>CHAPCY</h1>

<p>🌍 Worldwide Community</p>

</div>

</div>

<div class="online-info">

<span class="online-dot"></span>

2456 Online

</div>

<div class="top-icons">

<i class="fa-solid fa-user-group"></i>

<i class="fa-regular fa-bell"></i>

<i class="fa-solid fa-gear"></i>

<img src="default-avatar.png"
class="profile">

</div>

</header>

<!--=========================================
          CHAPCY V23 CENTER PANEL
==========================================-->

<main class="center-panel">

    <!--=========================
            CHAT HEADER
    ==========================-->

    <header class="chat-header">

        <div class="room-info">

            <div class="room-icon">

                🌍

            </div>

            <div class="room-text">

                <h2>General Chat</h2>

                <p>

                    <span class="online-dot"></span>

                    <span id="onlineCount">
                        2456 Users Online
                    </span>

                </p>

            </div>

        </div>

        <div class="header-actions">

            <button class="header-btn">

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>

            <button class="header-btn">

                <i class="fa-solid fa-phone"></i>

            </button>

            <button class="header-btn">

                <i class="fa-solid fa-video"></i>

            </button>

            <button class="header-btn">

                <i class="fa-solid fa-ellipsis-vertical"></i>

            </button>

        </div>

    </header>

    <!--=========================
          CHAT BODY
    ==========================-->

    <section
    id="messages"
    class="messages">

        <!-- Welcome -->

        <div class="welcome-card">

            <div class="welcome-glow"></div>

            <h3>

                ✨ Welcome to CHAPCY

            </h3>

            <p>

                Meet people around the world,

                chat,

                make friends

                and enjoy together.

            </p>

        </div>

        <!-- Messages zitaingia hapa kupitia Firebase -->

    </section>

    <!--=========================
        TYPING STATUS
    ==========================-->

    <div
    id="typingBox"
    class="typing-box">

        <div class="typing-animation">

            <span></span>

            <span></span>

            <span></span>

        </div>

        <span id="typingUser">

            Someone is typing...

        </span>

    </div>

    <!--=========================
        MESSAGE INPUT
    ==========================-->

    <footer class="message-box">

        <button class="input-btn">

            <i class="fa-regular fa-face-smile"></i>

        </button>

        <input

        id="messageInput"

        type="text"

        placeholder="Type your message...">

        <button class="input-btn">

            <i class="fa-solid fa-paperclip"></i>

        </button>

        <button class="input-btn">

            <i class="fa-solid fa-camera"></i>

        </button>

        <button class="input-btn">

            <i class="fa-solid fa-microphone"></i>

        </button>

        <button

        id="sendBtn"

        class="send-btn">

            <i class="fa-solid fa-paper-plane"></i>

        </button>

    </footer>

</main>
<script type="module" src="firebase.js"></script>

<script src="livechat.js"></script>

</body>

</html>
