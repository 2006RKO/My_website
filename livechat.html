<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHAPCY V24 Ultra Live Chat</title>

<link rel="stylesheet" href="livechat.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<!-- BACKGROUND -->

<div class="bg-glow"></div>

<!-- MAIN -->

<div class="chat-app">

<!-- =======================
        HEADER
======================== -->

<header class="topbar">

<div class="logo-box">

<img src="logo.png" class="logo">

<div>

<h1>CHAPCY</h1>

<p>🌍 Worldwide Community</p>

</div>

</div>

<div class="top-icons">

<button class="icon-btn">
<i class="fa-solid fa-user-group"></i>
</button>

<button class="icon-btn">
<i class="fa-regular fa-bell"></i>
<span class="badge">5</span>
</button>

<button class="icon-btn">
<i class="fa-solid fa-gear"></i>
</button>

<img src="default-avatar.png" class="profile">

</div>

</header>

<!-- =======================
        CHAT LAYOUT
======================== -->

<div class="chat-layout">

<!-- =======================
        LEFT PANEL
======================== -->

<aside class="left-panel">

<h3>Chats</h3>

<div id="roomList" class="room-list">

<!-- Firebase Rooms -->

</div>

</aside>

<!-- =======================
      CENTER PANEL
======================== -->

<main class="center-panel">

<!-- CHAT HEADER -->

<div class="chat-header">

<div class="room-info">

<div class="room-icon">

🌍

</div>

<div>

<h2 id="roomName">

General Chat

</h2>

<p>

<span class="online-dot"></span>

<span id="onlineCount">

0 Online

</span>

</p>

</div>

</div>

<div class="header-actions">

<button class="header-btn">

<i class="fa-solid fa-magnifying-glass"></i>

</button>

<button class="header-btn">

<i class="fa-solid fa-phone"></i>

</button>

<button class="header-btn">

<i class="fa-solid fa-video"></i>

</button>

<button class="header-btn">

<i class="fa-solid fa-ellipsis-vertical"></i>

</button>

</div>

</div>

<!-- MESSAGES -->

<section id="messages" class="messages">

<div class="welcome-card">

<h2>

✨ Welcome to CHAPCY

</h2>

<p>

Meet people around the world,
chat,
make friends,
and enjoy together.

</p>

</div>

<!-- Firebase Messages -->

</section>

<!-- TYPING -->

<div id="typingBox" class="typing-box">

<div class="typing-animation">

<span></span>

<span></span>

<span></span>

</div>

<p id="typingUser">

Someone is typing...

</p>

</div>

<!-- MESSAGE BOX -->

<footer class="message-box">

<div class="message-left">

<button id="emojiBtn" class="msg-btn">

<i class="fa-regular fa-face-smile"></i>

</button>

<label class="msg-btn">

<i class="fa-solid fa-paperclip"></i>

<input
type="file"
id="fileInput"
hidden
multiple>

</label>

<label class="msg-btn">

<i class="fa-regular fa-image"></i>

<input
type="file"
id="imageInput"
accept="image/*"
hidden>

</label>

<label class="msg-btn">

<i class="fa-solid fa-video"></i>

<input
type="file"
id="videoInput"
accept="video/*"
hidden>

</label>

</div>

<div class="input-wrapper">

<textarea

id="messageInput"

rows="1"

placeholder="Write a message...">

</textarea>

</div>

<div class="message-right">

<button id="cameraBtn" class="msg-btn">

<i class="fa-solid fa-camera"></i>

</button>

<button id="voiceBtn" class="msg-btn">

<i class="fa-solid fa-microphone"></i>

</button>

<button id="sendBtn" class="send-btn">

<i class="fa-solid fa-paper-plane"></i>

</button>

</div>

</footer>

</main>

<!-- =======================
      RIGHT PANEL
======================== -->

<aside class="right-panel">

<h3>

Online Users

</h3>

<div id="onlineUsers">

<!-- Firebase Online Users -->

</div>

</aside>

</div>

</div>

<script type="module" src="firebase.js"></script>

<script src="livechat.js"></script>

</body>
</html>
