<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta
name="theme-color"
content="#050816">

<title>CHAPCY | Login</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

<link rel="icon"
href="logo.png">

</head>

<body>

<!--============================
      BACKGROUND
=============================-->

<div class="background">

<img
src="file_000000005b1081f49cef6fcfbfb36468.png"
class="background-image">

<div class="background-overlay"></div>

<div class="stars"></div>

<div class="particles"></div>

</div>

<!--============================
      MAIN CONTAINER
=============================-->

<div class="auth-wrapper">

<div class="auth-container">

<!--=================================
        DIAGONAL SLIDER PANEL
==================================-->

<div class="switch-panel" id="switchPanel">

    <div class="panel-content">

        <img src="logo.png" class="panel-logo">

        <h1>CHAPCY</h1>

        <p>
            Connect • Chat • Share • Grow
        </p>

        <div class="panel-line"></div>

        <h3 id="panelTitle">
            Welcome Back
        </h3>

        <span id="panelText">

            Don't have an account?

        </span>

        <button
            id="switchBtn"
            class="switch-btn">

            CREATE ACCOUNT

        </button>

    </div>

</div>



<!--=================================
        REGISTER FORM
==================================-->

<div class="register-container">

<form id="registerForm">

<h2>Create Account</h2>

<p>
Join the CHAPCY community.
</p>

<div class="input-group">

<input
type="text"
id="regName"
placeholder="Full Name"
required>

</div>

<div class="input-group">

<input
type="email"
id="regEmail"
placeholder="Email Address"
required>

</div>

<div class="input-group">

<input
type="password"
id="regPassword"
placeholder="Password"
required>

</div>

<div class="input-group">

<input
type="password"
id="regConfirm"
placeholder="Confirm Password"
required>

</div>

<button
type="submit"
class="register-btn">

CREATE ACCOUNT

</button>

</form>

</div>



<!--=================================
          LOGIN FORM
==================================-->

<div class="login-container">

<form id="loginForm">

<h2>Login</h2>

<p>

Welcome back to CHAPCY.

</p>

<div class="input-group">

<input
type="email"
id="loginEmail"
placeholder="Email Address"
required>

</div>

<div class="input-group">

<input
type="password"
id="loginPassword"
placeholder="Password"
required>

</div>

<a
href="#"
class="forgot">

Forgot Password?

</a>

<button
type="submit"
class="login-btn">

LOGIN

</button>

</form>

</div>

</div>

</div>

<script src="register.css"></script>

</body>

</html>
