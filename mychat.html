<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CHAPCY</title>


    <!-- GOOGLE FONT -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- CSS -->
    <link
        rel="stylesheet"
        href="mychat.css"
    >

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="chat-background">

    <img
        src="file_00000000e8b881f4b968cb032d3a41e3.png"
        alt=""
    >

</div>


<!-- DARK GLASS OVERLAY -->

<div class="background-overlay"></div>



<!-- =====================================================
     MAIN PAGE
===================================================== -->

<main class="chat-page">


    <!-- =================================================
         CHAPCY HEADER
    ================================================= -->

    <header class="chat-header">


        <!-- LEFT SIDE -->

        <div class="header-left">


            <!-- MENU -->

            <button
                class="header-menu"
                id="menuBtn"
                type="button"
                aria-label="Open menu"
            >

                <i class="fa-solid fa-bars"></i>

            </button>



            <!-- PROFILE -->

            <button
                class="profile-avatar"
                id="profileBtn"
                type="button"
                aria-label="Open profile"
            >

                <img
                    src="profile.png"
                    alt="Profile"
                >

                <span class="online-dot"></span>

            </button>



            <!-- BRAND -->

            <div class="brand-info">

                <h1>
                    CHAPCY
                </h1>

                <p>

                    <span class="status-dot"></span>

                    Worldwide Community

                </p>

            </div>


        </div>



        <!-- =================================================
             RIGHT ACTIONS
        ================================================= -->

        <div class="header-actions">


            <!-- SEARCH -->

            <button
                type="button"
                id="searchBtn"
                aria-label="Search"
            >

                <i class="fa-solid fa-magnifying-glass"></i>

            </button>



            <!-- CAMERA -->

            <button
                type="button"
                id="cameraBtn"
                aria-label="Camera"
            >

                <i class="fa-solid fa-camera"></i>

            </button>



            <!-- MORE -->

            <button
                type="button"
                id="moreBtn"
                aria-label="More options"
            >

                <i class="fa-solid fa-ellipsis-vertical"></i>

            </button>


        </div>


    </header>



    <!-- =================================================
         CONTENT ITAANZA HAPA BAADAYE
    ================================================= -->

    <section class="chat-content">

        <!-- Tutajaza baada ya header -->

    </section>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="mychat.js"></script>


</body>

</html>
