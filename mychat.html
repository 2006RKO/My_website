<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC
    ===================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CHAPCY</title>


    <!-- =====================================================
         GOOGLE FONT
    ===================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         FONT AWESOME
    ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- =====================================================
         YOUR CSS
    ===================================================== -->

    <link
        rel="stylesheet"
        href="mychat.css"
    >

</head>


<body>


    <!-- =====================================================
         CHAPCY BACKGROUND
    ===================================================== -->

    <div class="chapcy-background"></div>

    <div class="chapcy-background-glow"></div>



    <!-- =====================================================
         CHAPCY APP
    ===================================================== -->

    <div class="chapcy-app">


        <!-- =================================================
             TRUE HEADER
        ================================================= -->

        <header class="chapcy-header">

            <div class="header-inner">


                <!-- =========================================
                     LEFT SIDE
                ========================================== -->

                <div class="header-left">


                    <!-- =====================================
                         MENU
                    ====================================== -->

                    <button
                        class="menu-btn"
                        id="menuBtn"
                        type="button"
                        aria-label="Open menu"
                    >

                        <i class="fa-solid fa-bars"></i>

                    </button>



                    <!-- =====================================
                         PROFILE
                    ====================================== -->

                    <button
                        class="header-profile"
                        id="profileBtn"
                        type="button"
                        aria-label="Open profile"
                    >

                        <img
                            src="file_00000000b0d8820a998b33ad9cf233cb.png"
                            alt="CHAPCY Profile"
                        >

                        <span class="online-dot"></span>

                    </button>



                    <!-- =====================================
                         BRAND
                    ====================================== -->

                    <div class="brand">

                        <div class="brand-name">
                            CHAPCY
                        </div>

                        <div class="brand-subtitle">
                            Worldwide Community
                        </div>

                    </div>

                </div>



                <!-- =========================================
                     RIGHT SIDE
                ========================================== -->

                <div class="header-actions">


                    <!-- =====================================
                         ADD CONTACT
                    ====================================== -->

                    <button
                        class="header-action add-contact-action"
                        id="addContactBtn"
                        type="button"
                        aria-label="Add contact"
                        title="Add Contact"
                    >

                        <i class="fa-solid fa-user-plus"></i>

                    </button>



                    <!-- =====================================
                         SEARCH
                    ====================================== -->

                    <button
                        class="header-action search-action"
                        id="searchBtn"
                        type="button"
                        aria-label="Search"
                        title="Search"
                    >

                        <i class="fa-solid fa-magnifying-glass"></i>

                    </button>



                    <!-- =====================================
                         NOTIFICATIONS
                    ====================================== -->

                    <button
                        class="header-action notification"
                        id="notificationBtn"
                        type="button"
                        aria-label="Notifications"
                        title="Notifications"
                    >

                        <i class="fa-regular fa-bell"></i>

                        <span class="notification-badge">
                            3
                        </span>

                    </button>



                    <!-- =====================================
                         MORE
                    ====================================== -->

                    <button
                        class="header-action more-action"
                        id="moreBtn"
                        type="button"
                        aria-label="More options"
                        title="More options"
                    >

                        <i class="fa-solid fa-ellipsis-vertical"></i>

                    </button>


                </div>


            </div>

        </header>



    </div>



    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->

    <script src="mychat.js"></script>


</body>

</html>
