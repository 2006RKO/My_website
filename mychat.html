<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#050817">

    <title>CHAPCY — Chats</title>

    <!-- GOOGLE FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- CHAPCY CHAT CSS -->
    <link rel="stylesheet" href="mychat.css">
</head>

<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="chat-background"></div>

<div class="chat-glow glow-left"></div>
<div class="chat-glow glow-right"></div>


<!-- =====================================================
     MAIN APP
===================================================== -->

<main class="chat-app">


    <!-- =================================================
         TOP HEADER
    ================================================= -->

    <header class="chat-header">


        <!-- PROFILE -->
        <button
            class="chat-profile-button"
            id="openProfile"
            type="button"
            aria-label="Open profile"
        >

            <div class="chat-profile">

                <img
                    src="file_00000000b0d8820a998b33ad9cf233cb.png"
                    alt="My profile"
                >

                <span class="profile-online"></span>

            </div>

        </button>


        <!-- TITLE -->
        <div class="chat-header-title">

            <h1>CHAPCY</h1>

            <span>
                <i class="fa-solid fa-circle"></i>
                Worldwide Community
            </span>

        </div>


        <!-- HEADER ACTIONS -->
        <div class="chat-header-actions">


            <!-- SEARCH -->
            <button
                class="header-icon"
                id="openSearch"
                type="button"
                aria-label="Search"
            >
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>


            <!-- CAMERA -->
            <button
                class="header-icon desktop-camera"
                id="openCamera"
                type="button"
                aria-label="Camera"
            >
                <i class="fa-solid fa-camera"></i>
            </button>


            <!-- MENU -->
            <button
                class="header-icon"
                id="openMenu"
                type="button"
                aria-label="Menu"
            >
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

        </div>

    </header>



    <!-- =================================================
         SEARCH BAR
    ================================================= -->

    <section
        class="chat-search-section"
        id="searchSection"
    >

        <div class="chat-search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="chatSearch"
                placeholder="Search chats or people..."
                autocomplete="off"
            >

            <button
                class="clear-search"
                id="clearSearch"
                type="button"
                aria-label="Clear search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>

    </section>



    <!-- =================================================
         QUICK FILTERS
    ================================================= -->

    <nav class="chat-filters" aria-label="Chat filters">

        <button
            class="chat-filter active"
            data-filter="all"
            type="button"
        >
            All
        </button>

        <button
            class="chat-filter"
            data-filter="unread"
            type="button"
        >
            Unread
        </button>

        <button
            class="chat-filter"
            data-filter="groups"
            type="button"
        >
            Groups
        </button>

        <button
            class="chat-filter"
            data-filter="favorites"
            type="button"
        >
            Favorites
        </button>

    </nav>



    <!-- =================================================
         CHAT CONTENT
    ================================================= -->

    <section class="chat-content">


        <!-- SECTION TITLE -->

        <div class="chat-section-heading">

            <div>

                <span>MESSAGES</span>

                <h2>My Chats</h2>

            </div>


            <!-- NEW CHAT -->

            <button
                class="new-chat-button"
                id="newChatButton"
                type="button"
                aria-label="New chat"
            >

                <i class="fa-solid fa-plus"></i>

            </button>

        </div>



        <!-- =================================================
             CHAT LIST
        ================================================= -->

        <div
            class="chat-list"
            id="chatList"
        >


            <!-- CHAT 1 -->

            <article
                class="chat-item"
                data-name="John"
                data-type="personal"
                data-unread="true"
            >

                <button
                    class="chat-avatar-button"
                    type="button"
                >

                    <div class="chat-avatar">

                        <img
                            src="file_00000000b0d8820a998b33ad9cf233cb.png"
                            alt="John"
                        >

                        <span class="avatar-online"></span>

                    </div>

                </button>


                <button
                    class="chat-main"
                    type="button"
                >

                    <div class="chat-info">

                        <div class="chat-name-row">

                            <h3>John</h3>

                            <time>9:42 PM</time>

                        </div>

                        <div class="chat-message-row">

                            <p>
                                Hey, are you coming?
                            </p>

                            <span class="unread-badge">
                                3
                            </span>

                        </div>

                    </div>

                </button>


                <button
                    class="chat-more"
                    type="button"
                    aria-label="Chat options"
                >

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </button>

            </article>



            <!-- CHAT 2 -->

            <article
                class="chat-item"
                data-name="Amina"
                data-type="personal"
                data-unread="false"
            >

                <button
                    class="chat-avatar-button"
                    type="button"
                >

                    <div class="chat-avatar">

                        <img
                            src="file_00000000b0d8820a998b33ad9cf233cb.png"
                            alt="Amina"
                        >

                    </div>

                </button>


                <button
                    class="chat-main"
                    type="button"
                >

                    <div class="chat-info">

                        <div class="chat-name-row">

                            <h3>Amina</h3>

                            <time>8:31 PM</time>

                        </div>

                        <div class="chat-message-row">

                            <p>

                                <i class="fa-solid fa-microphone"></i>
                                Voice message

                            </p>

                        </div>

                    </div>

                </button>


                <button
                    class="chat-more"
                    type="button"
                    aria-label="Chat options"
                >

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </button>

            </article>



            <!-- CHAT 3 -->

            <article
                class="chat-item"
                data-name="CHAPCY Sports"
                data-type="group"
                data-unread="true"
            >

                <button
                    class="chat-avatar-button"
                    type="button"
                >

                    <div class="chat-avatar group-avatar">

                        <i class="fa-solid fa-users"></i>

                    </div>

                </button>


                <button
                    class="chat-main"
                    type="button"
                >

                    <div class="chat-info">

                        <div class="chat-name-row">

                            <h3>CHAPCY Sports</h3>

                            <time>7:20 PM</time>

                        </div>

                        <div class="chat-message-row">

                            <p>
                                Rko: Game starts at 9!
                            </p>

                            <span class="unread-badge">
                                12
                            </span>

                        </div>

                    </div>

                </button>


                <button
                    class="chat-more"
                    type="button"
                    aria-label="Chat options"
                >

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </button>

            </article>



            <!-- CHAT 4 -->

            <article
                class="chat-item"
                data-name="Sarah"
                data-type="personal"
                data-unread="false"
            >

                <button
                    class="chat-avatar-button"
                    type="button"
                >

                    <div class="chat-avatar">

                        <img
                            src="file_00000000b0d8820a998b33ad9cf233cb.png"
                            alt="Sarah"
                        >

                    </div>

                </button>


                <button
                    class="chat-main"
                    type="button"
                >

                    <div class="chat-info">

                        <div class="chat-name-row">

                            <h3>Sarah</h3>

                            <time>Yesterday</time>

                        </div>

                        <div class="chat-message-row">

                            <p>

                                <i class="fa-regular fa-image"></i>
                                Photo

                            </p>

                        </div>

                    </div>

                </button>


                <button
                    class="chat-more"
                    type="button"
                    aria-label="Chat options"
                >

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </button>

            </article>



            <!-- CHAT 5 -->

            <article
                class="chat-item"
                data-name="Gaming Squad"
                data-type="group"
                data-unread="false"
            >

                <button
                    class="chat-avatar-button"
                    type="button"
                >

                    <div class="chat-avatar group-avatar">

                        <i class="fa-solid fa-gamepad"></i>

                    </div>

                </button>


                <button
                    class="chat-main"
                    type="button"
                >

                    <div class="chat-info">

                        <div class="chat-name-row">

                            <h3>Gaming Squad</h3>

                            <time>Yesterday</time>

                        </div>

                        <div class="chat-message-row">

                            <p>
                                Mike: Who's playing tonight?
                            </p>

                        </div>

                    </div>

                </button>


                <button
                    class="chat-more"
                    type="button"
                    aria-label="Chat options"
                >

                    <i class="fa-solid fa-ellipsis-vertical"></i>

                </button>

            </article>


        </div>



        <!-- EMPTY SEARCH STATE -->

        <div
            class="empty-search"
            id="emptySearch"
            hidden
        >

            <div class="empty-icon">

                <i class="fa-solid fa-magnifying-glass"></i>

            </div>

            <h3>No chats found</h3>

            <p>
                Try searching another name or username.
            </p>

        </div>

    </section>



    <!-- =================================================
         BOTTOM NAVIGATION
    ================================================= -->

    <nav
        class="chat-bottom-nav"
        aria-label="Main navigation"
    >


        <!-- CHATS -->

        <button
            class="bottom-nav-item active"
            data-page="chats"
            type="button"
        >

            <span class="bottom-icon">

                <i class="fa-solid fa-message"></i>

                <b>4</b>

            </span>

            <span>Chats</span>

        </button>



        <!-- STATUS -->

        <button
            class="bottom-nav-item"
            data-page="status"
            type="button"
        >

            <span class="bottom-icon">

                <i class="fa-regular fa-circle"></i>

            </span>

            <span>Status</span>

        </button>



        <!-- CALLS -->

        <button
            class="bottom-nav-item"
            data-page="calls"
            type="button"
        >

            <span class="bottom-icon">

                <i class="fa-solid fa-phone"></i>

            </span>

            <span>Calls</span>

        </button>



        <!-- COMMUNITIES -->

        <button
            class="bottom-nav-item"
            data-page="communities"
            type="button"
        >

            <span class="bottom-icon">

                <i class="fa-solid fa-users"></i>

            </span>

            <span>Communities</span>

        </button>



        <!-- PROFILE -->

        <button
            class="bottom-nav-item"
            data-page="profile"
            type="button"
        >

            <span class="bottom-icon">

                <i class="fa-regular fa-user"></i>

            </span>

            <span>Profile</span>

        </button>

    </nav>



    <!-- =================================================
         NEW CHAT FAB
    ================================================= -->

    <button
        class="new-chat-fab"
        id="newChatFab"
        type="button"
        aria-label="Start new chat"
    >

        <i class="fa-solid fa-plus"></i>

    </button>


</main>



<!-- =====================================================
     NEW CHAT MODAL
===================================================== -->

<div
    class="modal-overlay"
    id="newChatModal"
    aria-hidden="true"
>

    <section
        class="new-chat-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="newChatTitle"
    >

        <header class="modal-header">

            <div>

                <span>CHAPCY</span>

                <h2 id="newChatTitle">
                    New Chat
                </h2>

            </div>

            <button
                class="modal-close"
                id="closeNewChat"
                type="button"
                aria-label="Close"
            >

                <i class="fa-solid fa-xmark"></i>

            </button>

        </header>



        <!-- SEARCH PEOPLE -->

        <div class="people-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="peopleSearch"
                placeholder="Search people or @username..."
                autocomplete="off"
            >

        </div>



        <!-- CONTACT PERMISSION -->

        <button
            class="contact-permission"
            id="requestContacts"
            type="button"
        >

            <span class="permission-icon">

                <i class="fa-solid fa-address-book"></i>

            </span>

            <span class="permission-text">

                <strong>
                    Find people from your contacts
                </strong>

                <small>
                    Allow CHAPCY to find friends on your phone
                </small>

            </span>

            <i class="fa-solid fa-chevron-right"></i>

        </button>



        <!-- PEOPLE -->

        <div class="people-section">

            <div class="people-title">

                <span>
                    PEOPLE ON CHAPCY
                </span>

                <small>
                    12
                </small>

            </div>


            <div
                class="people-list"
                id="peopleList"
            >

                <article class="person-item">

                    <div class="person-avatar">

                        <img
                            src="file_00000000b0d8820a998b33ad9cf233cb.png"
                            alt="John"
                        >

                        <span></span>

                    </div>

                    <div class="person-info">

                        <strong>John</strong>

                        <small>@john_728</small>

                    </div>

                    <button
                        class="person-chat"
                        type="button"
                    >

                        <i class="fa-solid fa-message"></i>

                    </button>

                </article>


                <article class="person-item">

                    <div class="person-avatar">

                        <img
                            src="file_00000000b0d8820a998b33ad9cf233cb.png"
                            alt="Amina"
                        >

                    </div>

                    <div class="person-info">

                        <strong>Amina</strong>

                        <small>@amina_204</small>

                    </div>

                    <button
                        class="person-chat"
                        type="button"
                    >

                        <i class="fa-solid fa-message"></i>

                    </button>

                </article>

            </div>

        </div>


        <!-- INVITE -->

        <button
            class="invite-button"
            id="inviteFriends"
            type="button"
        >

            <span>

                <i class="fa-solid fa-user-plus"></i>

            </span>

            <strong>
                Invite friends to CHAPCY
            </strong>

            <i class="fa-solid fa-chevron-right"></i>

        </button>

    </section>

</div>



<!-- =====================================================
     PROFILE DRAWER
===================================================== -->

<aside
    class="profile-drawer"
    id="profileDrawer"
    aria-hidden="true"
>

    <div class="profile-drawer-header">

        <button
            id="closeProfile"
            type="button"
            aria-label="Close profile"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </button>

        <h2>Profile</h2>

    </div>


    <div class="profile-large">

        <div class="profile-large-image">

            <img
                src="file_00000000b0d8820a998b33ad9cf233cb.png"
                alt="Profile"
            >

            <button
                type="button"
                aria-label="Change profile photo"
            >

                <i class="fa-solid fa-camera"></i>

            </button>

        </div>

        <h3>Rko</h3>

        <p>@rko_7284</p>

        <span class="profile-status">
            <i class="fa-solid fa-circle"></i>
            Online
        </span>

    </div>


    <div class="profile-menu">

        <button type="button">

            <i class="fa-regular fa-user"></i>

            <span>
                Edit Profile
            </span>

            <i class="fa-solid fa-chevron-right"></i>

        </button>


        <button type="button">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                Privacy
            </span>

            <i class="fa-solid fa-chevron-right"></i>

        </button>


        <button type="button">

            <i class="fa-regular fa-bell"></i>

            <span>
                Notifications
            </span>

            <i class="fa-solid fa-chevron-right"></i>

        </button>


        <button type="button">

            <i class="fa-solid fa-gear"></i>

            <span>
                Settings
            </span>

            <i class="fa-solid fa-chevron-right"></i>

        </button>

    </div>

</aside>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="mychat.js"></script>

</body>
    </html>
